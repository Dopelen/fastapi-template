# Имя проекта задано явно: по умолчанию Compose берёт его из названия папки,
# а из "Fastapi-template__FastAPI-PostgreSQL-Kafka___" получается имя образа
# с сочетанием "__-", недопустимым в ссылках Docker.
name: fastapi-template

services:
  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"     # для внутреннего docker-сервиса (app)
      - "29092:29092"   # для подключения извне (localhost:29092)
    volumes:
      - kafka_data:/bitnami/kafka
    # Брокер поднимается заметно дольше приложения. Без healthcheck app стартовал
    # одновременно с ним и полагался только на ретраи внутри кода.
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-mydb}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    # Переменные задаются здесь, а не через env_file
    environment:
      APP_NAME: ${APP_NAME:-FastAPI Template}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mydb}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-my_topic}
      KAFKA_GROUP: ${KAFKA_GROUP:-default-group}
    # С условиями, а не просто списком: depends_on без condition гарантирует
    # только порядок запуска контейнеров, но не готовность сервисов принимать
    # соединения.
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  kafka_data:
  pgdata:
